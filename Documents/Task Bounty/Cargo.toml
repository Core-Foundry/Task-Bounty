[package]
name = "task-bounty"
version = "0.1.0"
edition = "2021"
authors = ["TaskBounty Contributors"]
license = "MIT"
description = "Decentralized task and reward board on Stellar"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "23"

[dev-dependencies]
soroban-sdk = { version = "23", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
